# Second-hop content head (SCH) pool discovery parameters (Stage 1-3 of the head-selection pipeline).

# Stage 2: LAHIS gradient importance under a three-condition contrast.
#   BRS(h) = z(I_FH) + z(I_TH) - z(I_SH)
#   I_FH = first-hop importance, I_TH = two-hop importance, I_SH = shortcut importance.
brs:
  components: [I_FH, I_TH, I_SH]
  signs:      [+1,   +1,   -1]
  zscore: true

# General pool = heads shared by at least four per-language top-N pools.
general_pool:
  per_language_top_n: 191           # candidate pool size per language before intersection (Llama; Qwen ~175)
  intersection: four_of_five
  min_languages: 4                  # preserves cross-language consensus while allowing one-language heterogeneity.
  # Reference general-pool sizes:
  expected_size:
    llama31_70: 70
    qwen25_72: 42
    qwen3_30b_a3b_base: null   # not set; discovered per model (MoE; attention-only OV read)
    gemma3_27b: null           # not set; discovered per model (Gemma; local/global interleave)
  # Pre-ablation candidate counts (do NOT use as the pool; robustness check only):
  pre_ablation_candidates:
    llama31_70: 191
    qwen25_72: 175

# Language-specific pools = mask the general pool, then top 4% per language.
language_specific_pool:
  mask_general: true
  top_fraction: 0.04

# Layer bands (the pool is not layer-coherent). assign_layer_band reads this:
# a head is in-band (tag 0) if low <= layer <= high, else out-of-band (tag 1).
layer_bands:
  llama31_70:
    in_band: {low: 14, high: 38}    # 59/70 heads in-band; stragglers at layers 0--5 and 74
  qwen25_72:
    in_band: {low: 13, high: 76}    # EMPIRICAL envelope (only ~20/42 heads fall in a narrow band)
  # Full-range placeholder bands; refit the in-band envelope from each model's discovered
  # (layer,head) set, as above.
  qwen3_30b_a3b_base:
    in_band: {low: 0, high: 47}     # full-range placeholder (48 layers, MoE)
  gemma3_27b:
    in_band: {low: 0, high: 61}     # full-range placeholder (62 layers; local/global interleave)

# Stage 3 validation diagnostics.
validation:
  ablation: mean                    # mean-ablation
  general_dnll_band: [0.84, 2.07]   # reference band for general-pool ablation dNLL (diagnostic)
  jaccard_overlap: true
  patchscopes_check: true
